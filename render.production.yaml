# ───────────────────────────────────────────────────────────────
# Render Blueprint — KFM Delice (PRODUCTION)
# ───────────────────────────────────────────────────────────────
# Use this for real production deployments.
# DO NOT use in demo/staging — use render.yaml (demo) instead.
# ───────────────────────────────────────────────────────────────
databases:
  - name: kfm-delice-db
    databaseName: kfm_delice
    user: kfm_delice_app
    region: frankfurt
    plan: starter
    ipAllowList: []

services:
  - type: web
    name: kfm-delice
    runtime: node
    plan: starter
    branch: main
    buildCommand: bash render-build.sh
    startCommand: bash render-start.sh
    envVars:
      - key: NODE_VERSION
        value: "22.18.0"
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PORT
        value: 10000
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: DATABASE_URL
        fromDatabase:
          name: kfm-delice-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOW_AUTO_SEED
        value: "false"
      - key: ALLOW_DEFAULT_TENANT
        value: "false"
      - key: ALLOW_PRISMA_DB_PUSH_FALLBACK
        value: "false"
      - key: ENABLE_PUBLIC_RESTAURANT_REGISTRATION
        value: "false"
      - key: NEXT_PUBLIC_SHOW_DEMO_CREDS
        value: "false"
      - key: SEED_TOKEN
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "KFM Delice <noreply@kfm-delice.com>"
      - key: SENTRY_DSN
        sync: false
