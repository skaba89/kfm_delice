name: Copy isolated monthly quota changes

on:
  push:
    branches: [commercial/monthly-order-quota-clean]
    paths: [.github/workflows/_copy-monthly-quota-safe.yml]

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: commercial/monthly-order-quota-clean
          fetch-depth: 0
      - name: Copy non-overlapping final files
        run: |
          set -euo pipefail
          git fetch origin commercial/monthly-order-quota
          git checkout origin/commercial/monthly-order-quota -- \
            src/lib/order-service.ts \
            src/app/api/platform/accounts/route.ts
          git config user.name "kfm-monthly-quota-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/order-service.ts src/app/api/platform/accounts/route.ts
          git commit -m "feat: enforce monthly order quota in order creation"
      - name: Remove one-shot workflow and push
        run: |
          set -euo pipefail
          git rm .github/workflows/_copy-monthly-quota-safe.yml
          git commit -m "chore: remove one-shot monthly quota copy workflow"
          git push origin HEAD:commercial/monthly-order-quota-clean
