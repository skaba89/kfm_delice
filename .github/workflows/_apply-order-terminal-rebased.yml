# trigger: rebased terminal atomicity
name: Apply rebased atomic terminal order patch

on:
  push:
    branches: [reliability/order-terminal-atomicity]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/order-terminal-atomicity
          fetch-depth: 0

      - name: Replace only the current PATCH implementation
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/app/api/orders/route.ts')
          s = p.read_text()

          old_import = 'import { orderSchema, orderPatchSchema, isValidOrderTransition, ORDER_TRANSITIONS, publicOrderSchema, detectForbiddenOrderFields } from "@/lib/validations";\n'
          new_import = 'import { orderSchema, orderPatchSchema, publicOrderSchema, detectForbiddenOrderFields } from "@/lib/validations";\n'
          if old_import not in s: raise SystemExit('validation import marker missing')
          s = s.replace(old_import, new_import, 1)

          marker = 'import { createOrderAtomically } from "@/lib/order-service";\n'
          addition = marker + 'import { applyOrderPatchAtomically } from "@/lib/order-transition-service";\n'
          if marker not in s: raise SystemExit('order-service import marker missing')
          s = s.replace(marker, addition, 1)

          start_marker = '    const { id, driverId, ...data } = validation.data;\n'
          end_marker = '    // WebSocket: broadcast the resulting order state.\n'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0: raise SystemExit('PATCH replacement markers missing')

          replacement = '''    const transition = await applyOrderPatchAtomically(validation.data, {\n      restaurantId: admin.restaurantId,\n      actorId: admin.id,\n      actorRole: admin.role,\n    });\n\n    if (!transition.ok) {\n      return NextResponse.json(\n        { error: transition.error, code: transition.code },\n        { status: transition.status }\n      );\n    }\n\n    const order = transition.order;\n    const isTerminalTransition = transition.becameDelivered || transition.becameCancelled;\n    const driverId = transition.assignedDriverId;\n\n    if (order.status === "delivered" && transition.customerId) {\n      try {\n        const { updateCustomerTier } = await import("@/lib/loyalty-tiers");\n        const newTier = await updateCustomerTier(transition.customerId, admin.restaurantId);\n        if (newTier) {\n          logger.debug(`[orders] Customer ${transition.customerId} tier reconciled: ${newTier}`);\n          try {\n            const { broadcastToType } = await import("@/lib/websocket-server");\n            broadcastToType("customer", "tier:upgraded", { customerId: transition.customerId, newTier });\n          } catch { /* WS not available */ }\n        }\n      } catch (e) {\n        console.warn("[orders] Tier projection update failed:", e instanceof Error ? e.message : String(e));\n      }\n    }\n\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/_apply-order-terminal-rebased.yml
          git config user.name "kfm-terminal-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: delegate order PATCH to atomic transition service"
          git push origin HEAD:reliability/order-terminal-atomicity
