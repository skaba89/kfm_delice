name: One-shot production lockfile refresh

on:
  push:
    branches:
      - agent/p0-no-regression-orders-migrations
    paths:
      - .github/workflows/one-shot-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-no-regression-orders-migrations
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh production dependency lock only
        run: npm audit fix --package-lock-only --omit=dev

      - name: Verify production audit
        run: npm audit --audit-level=high --omit=dev

      - name: Commit regenerated lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already satisfies the production audit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): refresh production security lockfile"
          git push origin HEAD:agent/p0-no-regression-orders-migrations
