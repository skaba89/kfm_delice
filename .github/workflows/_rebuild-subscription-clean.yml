name: Rebuild subscription branch cleanly

on:
  push:
    branches: [commercial/subscription-enforcement-clean]
    paths: [.github/workflows/_rebuild-subscription-clean.yml]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: commercial/subscription-enforcement-clean
          fetch-depth: 0
      - name: Copy final commercial files
        run: |
          set -euo pipefail
          git fetch origin commercial/subscription-enforcement
          git checkout origin/commercial/subscription-enforcement -- \
            src/__tests__/api/admin-entitlements.test.ts \
            src/__tests__/lib/auth.test.ts \
            src/__tests__/lib/subscription-access.test.ts \
            src/__tests__/lib/tenant-subscription.test.ts \
            src/app/api/admins/route.ts \
            'src/app/api/platform/accounts/[id]/quotas/route.ts' \
            src/lib/auth.ts \
            src/lib/subscription-access.ts \
            src/lib/tenant.ts
          git config user.name "kfm-subscription-rebuild-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "security: enforce SaaS subscription and admin entitlements"
      - name: Remove one-shot workflow and push
        run: |
          set -euo pipefail
          git rm .github/workflows/_rebuild-subscription-clean.yml
          git commit -m "chore: remove one-shot subscription rebuild workflow"
          git push origin HEAD:commercial/subscription-enforcement-clean
