# KFM Delice — CI pipeline (BLOCKING — all steps must pass)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET: "ci-test-jwt-secret-not-for-production-32chars-min"
  JWT_EXPIRES_IN: "1d"
  NEXT_PUBLIC_APP_NAME: "KFM Delice (CI)"
  NEXT_PUBLIC_VAPID_PUBLIC_KEY: "ci-test-public-key"
  VAPID_PRIVATE_KEY: "ci-test-private-key"
  VAPID_SUBJECT: "mailto:ci@example.com"
  NODE_ENV: "test"
  NEXT_TELEMETRY_DISABLED: "1"
  API_RATE_LIMIT: "1000"
  AUTH_RATE_LIMIT: "1000"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: SQLite — typecheck, lint, build, test (BLOCKING)
  # ─────────────────────────────────────────────────────────────
  sqlite-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "file:./prisma/ci-test.db"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select SQLite schema
        run: bash scripts/switch-schema.sh sqlite || true

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit --skipLibCheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test

  # ─────────────────────────────────────────────────────────────
  # Job 2: PostgreSQL — migrate + build + test (BLOCKING)
  # ─────────────────────────────────────────────────────────────
  postgres-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kfm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kfm_test?schema=public
      ALLOW_AUTO_SEED: "true"
      ALLOW_PRISMA_DB_PUSH_FALLBACK: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select PostgreSQL schema
        run: cp prisma/schema.postgres.prisma prisma/schema.prisma

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy (NO fallback — strict)
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test
