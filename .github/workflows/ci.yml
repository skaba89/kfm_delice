# KFM Delice — CI pipeline (BLOCKING — all steps must pass)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET: "ci-test-jwt-secret-not-for-production-32chars-min"
  JWT_EXPIRES_IN: "1d"
  NEXT_PUBLIC_APP_NAME: "KFM Delice (CI)"
  NEXT_PUBLIC_VAPID_PUBLIC_KEY: "ci-test-public-key"
  VAPID_PRIVATE_KEY: "ci-test-private-key"
  VAPID_SUBJECT: "mailto:ci@example.com"
  NODE_ENV: "test"
  NEXT_TELEMETRY_DISABLED: "1"
  API_RATE_LIMIT: "1000"
  AUTH_RATE_LIMIT: "1000"

jobs:
  sqlite-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "file:./prisma/ci-test.db"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select SQLite schema
        run: bash scripts/switch-schema.sh sqlite

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit --skipLibCheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test

  postgres-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kfm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kfm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kfm_test?schema=public
      ALLOW_AUTO_SEED: "true"
      ALLOW_PRISMA_DB_PUSH_FALLBACK: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Select PostgreSQL schema
        run: cp prisma/schema.postgres.prisma prisma/schema.prisma

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy (NO fallback — strict)
        run: npx prisma migrate deploy

      - name: Verify migrated schema
        run: node scripts/verify-schema-read-only.cjs

      - name: Build
        run: npm run build

      - name: Tests
        env:
          NODE_ENV: test
        run: npm run test

      - name: Seed and start Next.js server
        run: |
          set -euo pipefail
          node scripts/ensure-schema.cjs
          node scripts/auto-seed.cjs
          node_modules/.bin/next start -p 3000 -H 0.0.0.0 > /tmp/kfm-next.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          ready=false
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -sS -o /tmp/kfm-ready.json -w "%{http_code}" http://localhost:3000/api/ready || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Server is ready after ${i}x2s"
              cat /tmp/kfm-ready.json
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "::error::Server/schema did not become ready"
            echo "--- /api/ready response ---"
            cat /tmp/kfm-ready.json 2>/dev/null || true
            echo "--- Next.js log ---"
            cat /tmp/kfm-next.log 2>/dev/null || true
            exit 1
          fi

      - name: Run blocking production contract E2E
        env:
          BASE_URL: "http://localhost:3000"
          E2E_ADMIN_EMAIL: "admin@kfm-delice.com"
          E2E_ADMIN_PASSWORD: "AdminKFM2026!"
          E2E_SLUG: "kfm-delice"
        run: python3 scripts/e2e-production-contract.py

      - name: Stop Next.js server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then kill $SERVER_PID 2>/dev/null || true; fi

  playwright-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [sqlite-check]

    env:
      DATABASE_URL: "file:./prisma/ci-test-e2e.db"
      JWT_SECRET: "ci-test-jwt-secret-not-for-production-32chars-min"
      STRIPE_SECRET_KEY: "sk_test_ci-not-a-real-key"
      STRIPE_WEBHOOK_SECRET: "whsec_ci-not-a-real-secret"
      NODE_ENV: "test"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select SQLite schema
        run: bash scripts/switch-schema.sh sqlite

      - name: Prisma generate
        run: npx prisma generate

      - name: Push schema to test DB
        run: npx prisma db push --skip-generate

      - name: Build Next.js
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
