# KFM Delice — CI pipeline
# SQLite (default) + PostgreSQL (optional) jobs
# Stages: lint → typecheck → build → unit tests → e2e preflight
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET: "ci-test-jwt-secret-not-for-production-32chars-min"
  JWT_EXPIRES_IN: "1d"
  NEXT_PUBLIC_APP_NAME: "KFM Delice (CI)"
  NEXT_PUBLIC_VAPID_PUBLIC_KEY: "ci-test-public-key"
  VAPID_PRIVATE_KEY: "ci-test-private-key"
  VAPID_SUBJECT: "mailto:ci@example.com"
  NODE_ENV: "test"
  API_RATE_LIMIT: "1000"
  AUTH_RATE_LIMIT: "1000"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: SQLite — lint, typecheck, build, test
  # ─────────────────────────────────────────────────────────────
  sqlite-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "file:./prisma/ci-test.db"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select SQLite schema
        run: bash scripts/switch-schema.sh sqlite || true

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint
        continue-on-error: true  # pre-existing lint errors don't block CI

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test

  # ─────────────────────────────────────────────────────────────
  # Job 2: PostgreSQL — build + test against real Postgres
  # ─────────────────────────────────────────────────────────────
  postgres-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true  # optional job — don't block PR on Postgres-only issues

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kfm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kfm_test?schema=public
      ALLOW_AUTO_SEED: "true"
      ALLOW_PRISMA_DB_PUSH_FALLBACK: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select PostgreSQL schema
        run: cp prisma/schema.postgres.prisma prisma/schema.prisma

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy
        # TEMPORARY until migrations are fully clean — fallback to db push
        # if migrate deploy fails (e.g. migration history mismatch in CI).
        # Never use --accept-data-loss.
        run: |
          npx prisma migrate deploy || npx prisma db push --skip-generate

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test
