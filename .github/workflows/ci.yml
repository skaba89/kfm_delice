# KFM Delice — CI pipeline (BLOCKING — all steps must pass)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET: "ci-test-jwt-secret-not-for-production-32chars-min"
  JWT_EXPIRES_IN: "1d"
  NEXT_PUBLIC_APP_NAME: "KFM Delice (CI)"
  NEXT_PUBLIC_VAPID_PUBLIC_KEY: "ci-test-public-key"
  VAPID_PRIVATE_KEY: "ci-test-private-key"
  VAPID_SUBJECT: "mailto:ci@example.com"
  NODE_ENV: "test"
  NEXT_TELEMETRY_DISABLED: "1"
  API_RATE_LIMIT: "1000"
  AUTH_RATE_LIMIT: "1000"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: SQLite — typecheck, lint, build, test (BLOCKING)
  # ─────────────────────────────────────────────────────────────
  sqlite-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "file:./prisma/ci-test.db"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select SQLite schema
        run: bash scripts/switch-schema.sh sqlite

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit --skipLibCheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test

  # ─────────────────────────────────────────────────────────────
  # Job 2: PostgreSQL — migrate + schema readiness + strict E2E
  # ─────────────────────────────────────────────────────────────
  postgres-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kfm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kfm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kfm_test?schema=public
      ALLOW_AUTO_SEED: "true"
      ALLOW_PRISMA_DB_PUSH_FALLBACK: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # NODE_ENV=production would otherwise omit Vitest and other build/test tools.
        run: npm ci --include=dev

      - name: Select PostgreSQL schema
        run: bash scripts/switch-schema.sh postgres

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy (NO fallback — strict)
        run: npx prisma migrate deploy

      - name: Regression — recover historical PromoCode P3009
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const db = new PrismaClient();
          (async () => {
            try {
              const changed = await db.$executeRawUnsafe(`
                UPDATE _prisma_migrations
                SET finished_at = NULL,
                    rolled_back_at = NULL,
                    applied_steps_count = 0,
                    logs = 'CI simulated P3009 for PromoCode recovery test'
                WHERE migration_name = '20260713040000_add_promo_codes'
              `);
              if (Number(changed) < 1) {
                throw new Error('PromoCode migration row not found for P3009 regression test');
              }
              console.log('Historical PromoCode migration marked failed in ephemeral CI DB.');
            } finally {
              await db.$disconnect();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node scripts/repair-promo-migration.cjs
          npx prisma migrate deploy

      - name: Regression — recover historical ChatMessage P3009
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const db = new PrismaClient();
          (async () => {
            try {
              const changed = await db.$executeRawUnsafe(`
                UPDATE _prisma_migrations
                SET finished_at = NULL,
                    rolled_back_at = NULL,
                    applied_steps_count = 0,
                    logs = 'CI simulated P3009 for ChatMessage recovery test'
                WHERE migration_name = '20260713050000_add_chat_messages'
              `);
              if (Number(changed) < 1) {
                throw new Error('ChatMessage migration row not found for P3009 regression test');
              }
              console.log('Historical ChatMessage migration marked failed in ephemeral CI DB.');
            } finally {
              await db.$disconnect();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node scripts/repair-chat-message-migration.cjs
          npx prisma migrate deploy

      - name: Regression — recover partial LoyaltyTier P3018/P3009
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const db = new PrismaClient();
          (async () => {
            try {
              // Reproduce the production shape observed on Render: the LoyaltyTier
              // table/FK already exists, but the historical migration is failed
              // before its trailing Customer.tier statements are guaranteed.
              await db.$executeRawUnsafe('DROP INDEX IF EXISTS "Customer_tier_idx"');
              await db.$executeRawUnsafe('ALTER TABLE "Customer" DROP COLUMN IF EXISTS "tier"');

              const fkRows = await db.$queryRawUnsafe(`
                SELECT conname
                FROM pg_constraint
                WHERE conrelid = '"LoyaltyTier"'::regclass
                  AND conname = 'LoyaltyTier_restaurantId_fkey'
                  AND contype = 'f'
              `);
              if (fkRows.length !== 1) {
                throw new Error('LoyaltyTier FK must already exist to reproduce Render P3018');
              }

              const changed = await db.$executeRawUnsafe(`
                UPDATE _prisma_migrations
                SET finished_at = NULL,
                    rolled_back_at = NULL,
                    applied_steps_count = 0,
                    logs = 'CI simulated partial LoyaltyTier P3018/P3009 recovery test'
                WHERE migration_name = '20260713060000_add_loyalty_tiers'
              `);
              if (Number(changed) < 1) {
                throw new Error('LoyaltyTier migration row not found for recovery regression test');
              }
              console.log('Historical LoyaltyTier migration marked failed with existing FK and missing Customer.tier.');
            } finally {
              await db.$disconnect();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node scripts/repair-loyalty-tier-migration.cjs
          npx prisma migrate deploy
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const db = new PrismaClient();
          (async () => {
            try {
              const [tierColumn, tierIndex, migration] = await Promise.all([
                db.$queryRawUnsafe(`
                  SELECT data_type, is_nullable, column_default
                  FROM information_schema.columns
                  WHERE table_schema = 'public'
                    AND table_name = 'Customer'
                    AND column_name = 'tier'
                `),
                db.$queryRawUnsafe(`
                  SELECT indexname
                  FROM pg_indexes
                  WHERE schemaname = 'public'
                    AND tablename = 'Customer'
                    AND indexname = 'Customer_tier_idx'
                `),
                db.$queryRawUnsafe(`
                  SELECT finished_at, rolled_back_at
                  FROM _prisma_migrations
                  WHERE migration_name = '20260713060000_add_loyalty_tiers'
                  ORDER BY started_at DESC
                  LIMIT 1
                `),
              ]);
              if (
                tierColumn.length !== 1 ||
                tierColumn[0].data_type !== 'text' ||
                tierColumn[0].is_nullable !== 'NO' ||
                !String(tierColumn[0].column_default || '').includes("'bronze'") ||
                tierIndex.length !== 1 ||
                migration.length !== 1 ||
                migration[0].finished_at === null ||
                migration[0].rolled_back_at !== null
              ) {
                throw new Error('LoyaltyTier recovery did not restore the exact historical postconditions');
              }
              console.log('LoyaltyTier partial migration recovery verified in ephemeral PostgreSQL.');
            } finally {
              await db.$disconnect();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Runtime schema readiness (BLOCKING)
        run: node scripts/verify-schema-read-only.cjs

      - name: Build
        run: npm run build

      - name: Tests
        env:
          NODE_ENV: test
        run: npm run test

      # Seed is explicit and verified. We intentionally do NOT use `npm run start`
      # here because its historical semicolon allowed Next.js to start after a
      # failed seed and produced false-green E2E runs.
      - name: Seed CI database
        run: node scripts/auto-seed.cjs

      - name: Verify CI seed (BLOCKING)
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const db = new PrismaClient();
          (async () => {
            try {
              const [restaurant, admin, menuCount] = await Promise.all([
                db.restaurant.findUnique({ where: { slug: 'kfm-delice' }, select: { id: true } }),
                db.admin.findUnique({ where: { email: 'admin@kfm-delice.com' }, select: { id: true, restaurantId: true } }),
                db.menuItem.count({ where: { available: true } }),
              ]);
              if (!restaurant || !admin || !admin.restaurantId || menuCount < 1) {
                console.error('CI seed verification failed', { restaurant: !!restaurant, admin: !!admin, menuCount });
                process.exit(1);
              }
              console.log('CI seed verified', { restaurantId: restaurant.id, adminId: admin.id, menuCount });
            } finally {
              await db.$disconnect();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Schema readiness after seed (BLOCKING)
        run: node scripts/verify-schema-read-only.cjs

      - name: Start Next.js server
        run: |
          npx next start -p 3000 -H 0.0.0.0 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/status > /dev/null 2>&1; then
              echo "Server is up after ${i}x2s"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3000/api/status > /dev/null || (echo "Server did not start in time" && exit 1)

      - name: Run strict production contract E2E
        env:
          BASE_URL: "http://localhost:3000"
          E2E_ADMIN_EMAIL: "admin@kfm-delice.com"
          E2E_ADMIN_PASSWORD: "kfm2024"
          E2E_SLUG: "kfm-delice"
        run: python3 scripts/e2e-production-contract.py

      - name: Upload production contract E2E report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-production-contract-report
          path: artifacts/e2e-production-contract-report.json
          if-no-files-found: error

      - name: Stop Next.js server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then kill "$SERVER_PID" 2>/dev/null || true; fi

  # ─────────────────────────────────────────────────────────────
  # Job 3: Playwright E2E tests (BLOCKING — Mission 10/7)
  # ─────────────────────────────────────────────────────────────
  playwright-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [sqlite-check]

    env:
      DATABASE_URL: "file:./prisma/ci-test-e2e.db"
      JWT_SECRET: "ci-test-jwt-secret-not-for-production-32chars-min"
      STRIPE_SECRET_KEY: "sk_test_ci-not-a-real-key"
      STRIPE_WEBHOOK_SECRET: "whsec_ci-not-a-real-secret"
      NODE_ENV: "test"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select SQLite schema
        run: bash scripts/switch-schema.sh sqlite

      - name: Prisma generate
        run: npx prisma generate

      - name: Push schema to test DB
        run: npx prisma db push --skip-generate

      - name: Build Next.js
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
