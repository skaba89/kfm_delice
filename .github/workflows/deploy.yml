# KFM Delice — Render deployment gate
# Automatic production deploys are triggered only after the CI workflow
# completes successfully on main. Manual dispatch remains available.
name: Deploy to Render

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: production
        options: [production, staging]
      clear_cache:
        description: "Clear build cache"
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main')
      }}

    steps:
      - name: Verify Render deploy hook
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not configured. Refusing to deploy."
            exit 1
          fi

      - name: Trigger Render deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          CLEAR_CACHE: ${{ github.event.inputs.clear_cache || 'false' }}
        run: |
          set -euo pipefail
          echo "Triggering CI-gated Render deployment..."
          if [ "$CLEAR_CACHE" = "true" ]; then
            curl --fail-with-body --silent --show-error --location \
              --request POST \
              --header "Content-Type: application/json" \
              --data '{"clearCache": true}' \
              "$HOOK_URL"
          else
            curl --fail-with-body --silent --show-error --location \
              --request POST \
              "$HOOK_URL"
          fi

      - name: Deployment summary
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "Render deployment triggered after successful CI."
            echo "Commit: ${{ github.event.workflow_run.head_sha }}"
          else
            echo "Manual Render deployment triggered."
            echo "Environment: ${{ github.event.inputs.environment }}"
          fi
