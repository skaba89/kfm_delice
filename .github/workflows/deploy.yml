# KFM Delice - Render Deploy Trigger
# Production auto-deploy runs only after the CI workflow completed successfully
# on main. Manual dispatch remains available for controlled redeploys.
name: Deploy to Render

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: production
        options: [production, staging]
      clear_cache:
        description: "Clear build cache"
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main')
      }}
    # Optional: enable a protected GitHub environment once configured.
    # environment: production
    steps:
      - name: Check Render deploy hook secret
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL not set - refusing to deploy"
            exit 1
          fi

      - name: Trigger Render deploy hook
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          CLEAR_CACHE: ${{ github.event.inputs.clear_cache || 'false' }}
        run: |
          echo "Triggering gated Render deploy..."
          if [ "$CLEAR_CACHE" = "true" ]; then
            curl --fail-with-body -sSL -X POST \
              -H "Content-Type: application/json" \
              -d '{"clearCache": true}' \
              "$HOOK_URL"
          else
            curl --fail-with-body -sSL -X POST "$HOOK_URL"
          fi

      - name: Summary
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "Render deploy triggered after successful CI. Commit: $CI_SHA"
          else
            echo "Manual Render deploy triggered. Commit context: ${{ github.sha }}"
          fi
