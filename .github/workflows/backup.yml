# KFM Delice - Daily PostgreSQL Backup at 02:00 UTC (30-day retention + optional S3)
name: PostgreSQL Backup
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Days to retain (default 30)"
        required: false
        default: "30"

concurrency:
  group: postgres-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pg client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Verify DATABASE_URL is PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret not set"
            exit 1
          fi
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) echo "PostgreSQL URL detected" ;;
            *)
              echo "::error::DATABASE_URL is not PostgreSQL - refusing to back up SQLite"
              exit 1
              ;;
          esac

      - name: Generate artifact label
        id: fname
        run: |
          TS=$(date -u +%Y%m%d-%H%M%S)
          echo "artifact=kfm-delice-${TS}" >> "$GITHUB_OUTPUT"
          echo "timestamp=${TS}" >> "$GITHUB_OUTPUT"

      - name: Create and verify backup set
        id: backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          BACKUP_DIR="artifacts/postgres-backup"
          rm -rf "$BACKUP_DIR"
          mkdir -p "$BACKUP_DIR"

          BACKUP_DIR="$BACKUP_DIR" \
          BACKUP_LABEL="scheduled-${{ steps.fname.outputs.timestamp }}" \
          bash scripts/backup-postgres.sh

          mapfile -t dumps < <(find "$BACKUP_DIR" -maxdepth 1 -type f -name '*.dump' -print)
          if [ "${#dumps[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .dump file, found ${#dumps[@]}"
            exit 1
          fi

          dump_file="${dumps[0]}"
          manifest_file="${dump_file}.sha256"
          catalog_file="${dump_file}.list.txt"
          test -s "$dump_file"
          test -s "$manifest_file"
          test -s "$catalog_file"

          (cd "$(dirname "$dump_file")" && sha256sum --check "$(basename "$manifest_file")")
          pg_restore --list "$dump_file" >/dev/null

          echo "dump_file=$dump_file" >> "$GITHUB_OUTPUT"
          echo "manifest_file=$manifest_file" >> "$GITHUB_OUTPUT"
          echo "catalog_file=$catalog_file" >> "$GITHUB_OUTPUT"
          echo "Backup set verified:"
          ls -lh "$dump_file" "$manifest_file" "$catalog_file"

      - name: Upload verified backup set to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.fname.outputs.artifact }}
          path: |
            ${{ steps.backup.outputs.dump_file }}
            ${{ steps.backup.outputs.manifest_file }}
            ${{ steps.backup.outputs.catalog_file }}
          retention-days: ${{ github.event.inputs.retention_days || 30 }}
          if-no-files-found: error

      - name: Mirror verified backup set to S3 (optional)
        if: ${{ secrets.BACKUP_S3_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_KEY_SECRET }}
          AWS_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_DEFAULT_REGION: us-east-1
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          DUMP_FILE: ${{ steps.backup.outputs.dump_file }}
          MANIFEST_FILE: ${{ steps.backup.outputs.manifest_file }}
          CATALOG_FILE: ${{ steps.backup.outputs.catalog_file }}
        run: |
          set -euo pipefail
          for file in "$DUMP_FILE" "$MANIFEST_FILE" "$CATALOG_FILE"; do
            aws s3 cp "$file" "s3://$BUCKET/$(basename "$file")" \
              --endpoint-url "$AWS_ENDPOINT_URL" \
              --storage-class STANDARD_IA
          done

      - name: Summary
        run: |
          echo "====================================="
          echo "  PostgreSQL verified backup complete"
          echo "  Artifact: ${{ steps.fname.outputs.artifact }}"
          echo "  Retention: ${{ github.event.inputs.retention_days || 30 }} days"
          echo "  Includes: dump + SHA-256 manifest + pg_restore catalog"
          echo "====================================="
