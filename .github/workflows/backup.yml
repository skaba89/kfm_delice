# KFM Delice - Daily PostgreSQL Backup at 02:00 UTC (30-day retention + optional S3)
name: PostgreSQL Backup
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Days to retain (default 30)"
        required: false
        default: "30"
concurrency:
  group: postgres-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pg client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
      - name: Verify DATABASE_URL is PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret not set"
            exit 1
          fi
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) echo "PostgreSQL URL detected" ;;
            *)
              echo "::error::DATABASE_URL is not PostgreSQL - refusing to back up SQLite"
              exit 1
              ;;
          esac
      - name: Generate backup filename
        id: fname
        run: |
          TS=$(date -u +%Y%m%d-%H%M%S)
          echo "filename=kfm-delice-${TS}.dump" >> $GITHUB_OUTPUT
          echo "timestamp=${TS}" >> $GITHUB_OUTPUT
      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          bash scripts/backup-postgres.sh
          ls -lh backups/
          mv "backups/$(ls -t backups/ | head -1)" "${{ steps.fname.outputs.filename }}"
      - name: Upload to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.fname.outputs.filename }}
          path: ${{ steps.fname.outputs.filename }}
          retention-days: ${{ github.event.inputs.retention_days || 30 }}
      - name: Mirror to S3 (optional)
        if: ${{ secrets.BACKUP_S3_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_KEY_SECRET }}
          AWS_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_DEFAULT_REGION: us-east-1
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          FILE: ${{ steps.fname.outputs.filename }}
        run: |
          aws s3 cp "$FILE" "s3://$BUCKET/$FILE" --endpoint-url "$AWS_ENDPOINT_URL" --storage-class STANDARD_IA
      - name: Summary
        run: |
          echo "====================================="
          echo "  PostgreSQL backup complete"
          echo "  File: ${{ steps.fname.outputs.filename }}"
          echo "  Retention: ${{ github.event.inputs.retention_days || 30 }} days"
          echo "====================================="
