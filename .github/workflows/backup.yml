# KFM Delice - Daily PostgreSQL Backup at 02:00 UTC (30-day retention + optional S3)
name: PostgreSQL Backup

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Days to retain (default 30)"
        required: false
        default: "30"

concurrency:
  group: postgres-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub does not allow direct secrets.* references in an `if:` expression.
    # Promote optional S3 settings to job env, then gate steps with env.*.
    env:
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
      BACKUP_S3_KEY_SECRET: ${{ secrets.BACKUP_S3_KEY_SECRET }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pg client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Verify DATABASE_URL is PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret not set"
            exit 1
          fi
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) echo "PostgreSQL URL detected" ;;
            *)
              echo "::error::DATABASE_URL is not PostgreSQL - refusing to back up SQLite"
              exit 1
              ;;
          esac

      - name: Create and verify PostgreSQL backup
        id: backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_DIR: artifacts/postgres-backup
          BACKUP_LABEL: github-${{ github.run_id }}
        run: |
          set -euo pipefail

          rm -rf "$BACKUP_DIR"
          mkdir -p "$BACKUP_DIR"

          bash scripts/backup-postgres.sh

          mapfile -t dump_files < <(find "$BACKUP_DIR" -maxdepth 1 -type f -name '*.dump' -print | sort)
          if [ "${#dump_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one PostgreSQL .dump file, found ${#dump_files[@]}"
            printf '%s\n' "${dump_files[@]:-}" >&2
            exit 1
          fi

          backup_file="${dump_files[0]}"
          manifest_file="$backup_file.sha256"
          catalog_file="$backup_file.list.txt"

          test -s "$backup_file"
          test -s "$manifest_file"
          test -s "$catalog_file"

          # Fail closed before upload if the custom-format archive cannot be parsed.
          pg_restore --list "$backup_file" >/dev/null

          # Verify the portable SHA-256 manifest against the exact dump bytes.
          (
            cd "$(dirname "$backup_file")"
            sha256sum --check "$(basename "$manifest_file")"
          )

          backup_name="$(basename "$backup_file")"
          echo "backup_path=$backup_file" >> "$GITHUB_OUTPUT"
          echo "backup_name=$backup_name" >> "$GITHUB_OUTPUT"

          echo "Verified PostgreSQL backup: $backup_file"
          ls -lh "$backup_file" "$manifest_file" "$catalog_file"

      - name: Upload to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.backup_name }}
          path: |
            ${{ steps.backup.outputs.backup_path }}
            ${{ steps.backup.outputs.backup_path }}.sha256
            ${{ steps.backup.outputs.backup_path }}.list.txt
          retention-days: ${{ github.event.inputs.retention_days || 30 }}
          if-no-files-found: error

      - name: Validate optional S3 configuration
        if: ${{ env.BACKUP_S3_BUCKET != '' }}
        run: |
          set -euo pipefail
          if [ -z "$BACKUP_S3_KEY_ID" ] || [ -z "$BACKUP_S3_KEY_SECRET" ]; then
            echo "::error::BACKUP_S3_BUCKET is configured but BACKUP_S3_KEY_ID/BACKUP_S3_KEY_SECRET is missing"
            exit 1
          fi
          command -v aws >/dev/null 2>&1 || {
            echo "::error::AWS CLI is unavailable on the runner"
            exit 1
          }

      - name: Mirror to S3 (optional)
        if: ${{ env.BACKUP_S3_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ env.BACKUP_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.BACKUP_S3_KEY_SECRET }}
          AWS_ENDPOINT_URL: ${{ env.BACKUP_S3_ENDPOINT }}
          AWS_DEFAULT_REGION: us-east-1
          BUCKET: ${{ env.BACKUP_S3_BUCKET }}
          FILE: ${{ steps.backup.outputs.backup_path }}
          OBJECT_NAME: ${{ steps.backup.outputs.backup_name }}
        run: |
          set -euo pipefail
          endpoint_args=()
          if [ -n "$AWS_ENDPOINT_URL" ]; then
            endpoint_args=(--endpoint-url "$AWS_ENDPOINT_URL")
          fi
          aws s3 cp "$FILE" "s3://$BUCKET/$OBJECT_NAME" "${endpoint_args[@]}" --storage-class STANDARD_IA
          aws s3 cp "$FILE.sha256" "s3://$BUCKET/$OBJECT_NAME.sha256" "${endpoint_args[@]}" --storage-class STANDARD_IA
          aws s3 cp "$FILE.list.txt" "s3://$BUCKET/$OBJECT_NAME.list.txt" "${endpoint_args[@]}" --storage-class STANDARD_IA

      - name: Summary
        run: |
          echo "====================================="
          echo "  PostgreSQL backup complete"
          echo "  File: ${{ steps.backup.outputs.backup_name }}"
          echo "  Checksum: ${{ steps.backup.outputs.backup_name }}.sha256"
          echo "  Catalog: ${{ steps.backup.outputs.backup_name }}.list.txt"
          echo "  Retention: ${{ github.event.inputs.retention_days || 30 }} days"
          if [ -n "$BACKUP_S3_BUCKET" ]; then
            echo "  S3 mirror: enabled"
          else
            echo "  S3 mirror: disabled"
          fi
          echo "====================================="
