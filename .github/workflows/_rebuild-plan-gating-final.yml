name: Rebuild final plan gating

on:
  push:
    branches: [commercial/plan-feature-gating-final]
    paths: [.github/workflows/_rebuild-plan-gating-final.yml]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: commercial/plan-feature-gating-final
          fetch-depth: 0
      - name: Copy non-loyalty commercial gating files
        run: |
          set -euo pipefail
          git fetch origin commercial/plan-feature-gating-clean
          git checkout origin/commercial/plan-feature-gating-clean -- \
            src/lib/commercial-entitlements.ts \
            src/lib/commercial-feature-gate.ts \
            src/__tests__/lib/commercial-entitlements.test.ts \
            src/__tests__/lib/commercial-feature-gate.test.ts \
            src/__tests__/api/premium-route-feature-gates.test.ts \
            src/app/api/invoices/route.ts \
            src/app/api/quotes/route.ts \
            src/app/api/expenses/route.ts \
            src/app/api/staff/route.ts \
            src/app/api/drivers/route.ts
          git config user.name "kfm-plan-gating-rebuild-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "commercial: enforce premium admin route features"
      - name: Remove one-shot workflow and push
        run: |
          set -euo pipefail
          git rm .github/workflows/_rebuild-plan-gating-final.yml
          git commit -m "chore: remove one-shot plan rebuild workflow"
          git push origin HEAD:commercial/plan-feature-gating-final
