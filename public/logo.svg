<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient: deep orange to red (KFM Delice brand colors) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <!-- Subtle inner highlight -->
    <linearGradient id="innerGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Clip to rounded square -->
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#roundedClip)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="512" height="512" fill="url(#innerGlow)"/>

    <!-- Decorative circle (plate) -->
    <circle cx="256" cy="200" r="110" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>
    <circle cx="256" cy="200" r="86" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

    <!-- Fork (left of plate) -->
    <g fill="#ffffff" transform="translate(108,118)">
      <rect x="10" y="0" width="6" height="80" rx="3"/>
      <rect x="0" y="0" width="3" height="22" rx="1.5"/>
      <rect x="6" y="0" width="3" height="28" rx="1.5"/>
      <rect x="12" y="0" width="3" height="22" rx="1.5"/>
      <rect x="18" y="0" width="3" height="22" rx="1.5"/>
      <rect x="2" y="78" width="22" height="6" rx="2"/>
    </g>

    <!-- Knife (right of plate) -->
    <g fill="#ffffff" transform="translate(372,118)">
      <path d="M 10 0 L 22 0 L 22 50 L 16 84 L 16 130 L 10 130 L 10 84 Z"/>
      <rect x="10" y="0" width="12" height="6" rx="2"/>
    </g>
  </g>

  <!-- KFM monogram (large, centered, bold) -->
  <text x="256" y="240"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="118" font-weight="900"
        text-anchor="middle"
        fill="#ffffff"
        letter-spacing="4">KFM</text>

  <!-- Delice subtitle -->
  <text x="256" y="288"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="500"
        text-anchor="middle"
        fill="#ffffff"
        fill-opacity="0.92"
        letter-spacing="8">DELICE</text>

  <!-- Tagline -->
  <text x="256" y="425"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="400"
        text-anchor="middle"
        fill="#ffffff"
        fill-opacity="0.85"
        letter-spacing="3">L'ART DU GOÛT GUINÉEN</text>

  <!-- Small star/separator -->
  <g fill="#ffffff" fill-opacity="0.7" transform="translate(256,360)">
    <path d="M 0 -8 L 2.4 -2.4 L 8 -2.4 L 3.2 1 L 5 7 L 0 3.2 L -5 7 L -3.2 1 L -8 -2.4 L -2.4 -2.4 Z"/>
  </g>
</svg>
