# ───────────────────────────────────────────────────────────────────
# Render Blueprint — KFM Delice (PostgreSQL production)
# ───────────────────────────────────────────────────────────────────
# Production deployments are triggered by the CI-gated GitHub workflow
# (.github/workflows/deploy.yml). Render autoDeploy is disabled so a push to
# main cannot bypass the blocking CI pipeline.
#
# SCALE_MODE defaults to single-instance so the current pilot can run without
# pretending distributed guarantees exist. Before horizontal scaling, configure
# UPSTASH_REDIS_REST_URL + UPSTASH_REDIS_REST_TOKEN and set SCALE_MODE=national
# (or multi-instance). The production safety check will then make the
# distributed limiter mandatory.
# ───────────────────────────────────────────────────────────────────
databases:
  - name: kfm-delice-db
    databaseName: kfm_delice
    user: kfm_delice_app
    region: frankfurt
    plan: free
    ipAllowList: []

services:
  - type: web
    name: kfm-delice
    runtime: node
    plan: free
    branch: main
    buildCommand: bash render-build.sh
    startCommand: bash render-start.sh
    # /api/status remains a liveness probe. DB/schema readiness is enforced
    # before Next.js starts by render-start.sh.
    healthCheckPath: /api/status
    healthCheckInitialTimeoutSec: 300
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22.18.0"
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: production
      - key: SCALE_MODE
        value: single-instance
      - key: REALTIME_MODE
        value: disabled
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PORT
        value: 10000
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: DATABASE_URL
        fromDatabase:
          name: kfm-delice-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: TENANT_STRATEGY
        value: slug-header
      - key: ALLOW_DEFAULT_TENANT
        value: "false"
      - key: ALLOW_AUTO_SEED
        value: "false"
      - key: ALLOW_LOGIN_AUTO_SEED
        value: "false"
      - key: ALLOW_PRISMA_DB_PUSH_FALLBACK
        value: "false"
      - key: ENABLE_PUBLIC_RESTAURANT_REGISTRATION
        value: "false"
      - key: NEXT_PUBLIC_SHOW_DEMO_CREDS
        value: "false"
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: SEED_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "KFM Delice <noreply@kfm-delice.com>"
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:admin@kfm-delice.com"
      - key: SENTRY_DSN
        sync: false
      - key: ORANGE_MONEY_CLIENT_ID
        sync: false
      - key: ORANGE_MONEY_CLIENT_SECRET
        sync: false
      - key: ORANGE_MONEY_MERCHANT_NUMBER
        sync: false
      - key: MTN_MOMO_SUBSCRIPTION_KEY
        sync: false
      - key: MTN_MOMO_USER_ID
        sync: false
      - key: MTN_MOMO_API_KEY
        sync: false
      - key: WAVE_API_KEY
        sync: false
      - key: WAVE_BUSINESS_ID
        sync: false
