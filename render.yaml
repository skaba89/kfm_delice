# ───────────────────────────────────────────────────────────────────
# Render Blueprint — KFM Delice (PostgreSQL production)
# ───────────────────────────────────────────────────────────────────
# This Blueprint provisions:
#   1. A managed PostgreSQL database (free tier — 90 days, then paid)
#   2. A Next.js web service connected to it
#
# To use:
#   1. Push this file to your repo as render.yaml (replacing the SQLite one)
#   2. In Render dashboard → New → Blueprint → pick this repo
#   3. Set the sync:false env vars (PUBLIC_APP_URL, SMTP_*, VAPID_*)
#      in the Render dashboard after first deploy
#
# NOTE: Render's free PostgreSQL expires after 90 days. For long-term
#       dev/staging, use the free SQLite render.yaml.sqlite instead.
# ───────────────────────────────────────────────────────────────────
databases:
  - name: kfm-delice-db
    databaseName: kfm_delice
    user: kfm_delice_app
    region: frankfurt
    plan: free
    ipAllowList: []

services:
  - type: web
    name: kfm-delice
    runtime: node
    plan: free
    branch: main
    buildCommand: bash render-build.sh
    startCommand: bash render-start.sh
    healthCheckPath: /api/status
    healthCheckInitialTimeoutSec: 60
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PORT
        value: 10000
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: DATABASE_URL
        fromDatabase:
          name: kfm-delice-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: TENANT_STRATEGY
        value: slug-header
      # ── Mission 6: All dangerous flags OFF in production ──
      - key: ALLOW_DEFAULT_TENANT
        value: "false"
      - key: ALLOW_AUTO_SEED
        value: "false"
      - key: ALLOW_LOGIN_AUTO_SEED
        value: "false"
      - key: ALLOW_PRISMA_DB_PUSH_FALLBACK
        value: "false"
      - key: ENABLE_PUBLIC_RESTAURANT_REGISTRATION
        value: "false"
      - key: NEXT_PUBLIC_SHOW_DEMO_CREDS
        value: "false"
      # ── Mission 6: Required secrets (sync: false = set in Render dashboard) ──
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: SEED_TOKEN
        sync: false
      # ── Stripe (optional — set if accepting card payments) ──
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      # ── Rate limiting: Redis/Upstash for multi-instance ──
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # ── Email ──
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "KFM Delice <noreply@kfm-delice.com>"
      # ── Push notifications ──
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:admin@kfm-delice.com"
      # ── Sentry ──
      - key: SENTRY_DSN
        sync: false
      # ── Orange Money (Guinea) ──
      - key: ORANGE_MONEY_CLIENT_ID
        sync: false
      - key: ORANGE_MONEY_CLIENT_SECRET
        sync: false
      - key: ORANGE_MONEY_MERCHANT_NUMBER
        sync: false
      # ── MTN MoMo (Guinea) ──
      - key: MTN_MOMO_SUBSCRIPTION_KEY
        sync: false
      - key: MTN_MOMO_USER_ID
        sync: false
      - key: MTN_MOMO_API_KEY
        sync: false
      # ── Wave (Guinea) ──
      - key: WAVE_API_KEY
        sync: false
      - key: WAVE_BUSINESS_ID
        sync: false
