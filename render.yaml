# ───────────────────────────────────────────────────────────────────
# Render Blueprint — KFM Delice (PostgreSQL production)
# ───────────────────────────────────────────────────────────────────
# This Blueprint provisions:
#   1. A managed PostgreSQL database (free tier — 90 days, then paid)
#   2. A Next.js web service connected to it
#
# To use:
#   1. Push this file to your repo as render.yaml (replacing the SQLite one)
#   2. In Render dashboard → New → Blueprint → pick this repo
#   3. Set the sync:false env vars (PUBLIC_APP_URL, SMTP_*, VAPID_*)
#      in the Render dashboard after first deploy
#
# NOTE: Render's free PostgreSQL expires after 90 days. For long-term
#       dev/staging, use the free SQLite render.yaml.sqlite instead.
# ───────────────────────────────────────────────────────────────────
databases:
  - name: kfm-delice-db
    databaseName: kfm_delice
    user: kfm_delice_app
    region: frankfurt
    plan: free
    ipAllowList: []

services:
  - type: web
    name: kfm-delice
    runtime: node
    plan: free
    branch: main
    buildCommand: bash render-build.sh
    startCommand: bash render-start.sh
    healthCheckPath: /api/status
    healthCheckInitialTimeoutSec: 60
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: demo
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PORT
        value: 10000
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: DATABASE_URL
        fromDatabase:
          name: kfm-delice-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_APP_URL
        sync: false
      - key: TENANT_STRATEGY
        value: slug-header
      # KFM Delice is currently a single-tenant deployment. Set this to
      # "false" once multiple restaurants are onboarded, so that requests
      # without an explicit tenant slug are rejected instead of silently
      # falling back to the first restaurant.
      - key: ALLOW_DEFAULT_TENANT
        value: "true"
      # Auto-seed creates demo accounts (admin@kfm-delice.com / kfm2024, etc.)
      # on first deploy when the database is empty. Set to "false" once real
      # production data is in place to prevent anyone with source code access
      # from logging in with known credentials.
      - key: ALLOW_AUTO_SEED
        value: "true"
      # Required to call /api/seed in production. Generate with:
      #   openssl rand -hex 32
      # Stored as a Render secret env var (not generated by Render).
      - key: SEED_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "KFM Delice <noreply@kfm-delice.com>"
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:admin@kfm-delice.com"
      - key: NEXT_PUBLIC_SHOW_DEMO_CREDS
        value: "false"
      # Public restaurant registration is DISABLED by default.
      # Set to "true" only for demo/onboarding events.
      # In the future SaaS architecture, only the platform super-admin
      # will create restaurants.
      - key: ENABLE_PUBLIC_RESTAURANT_REGISTRATION
        value: "false"
      # Mission 8: Allow prisma db push fallback when migrate deploy fails.
      # Demo/staging: "true" (allows the fallback to keep the demo running)
      # Real production: "false" (a failed migration is a clear signal
      #   that something is wrong and should be investigated manually)
      - key: ALLOW_PRISMA_DB_PUSH_FALLBACK
        value: "true"
