services:
  - type: web
    name: kfm-delice
    runtime: node
    plan: free
    branch: main
    buildCommand: bash render-build.sh
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: true
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SHOW_DEMO_CREDS
        value: "false"
