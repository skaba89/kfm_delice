services:
  - type: web
    name: kfm-delice
    runtime: node
    plan: free
    branch: main
    buildCommand: bun install && bun run build
    startCommand: bun run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "file:./data/kfm-delice.db"
      - key: JWT_SECRET
        generateValue: true
